<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>飞行棋</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff1ee;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#5a3d4a;display:flex;flex-direction:column;align-items:center;padding:12px 8px 28px;user-select:none;-webkit-user-select:none}
h1{margin:4px 0 10px;font-size:20px}
#cv{width:min(96vw,620px);height:auto;aspect-ratio:1;border-radius:20px;box-shadow:0 6px 24px #e8a0b455;touch-action:manipulation}
#bar{width:min(96vw,620px);display:flex;gap:8px;margin-top:12px}
.chip{flex:1;text-align:center;padding:6px 2px;border-radius:14px;background:#fff;border:3px solid transparent;font-size:12px;transition:.2s}
.chip.on{transform:translateY(-3px);box-shadow:0 4px 12px #0002}
.chip canvas{width:40px;height:40px;display:block;margin:0 auto 2px}
.chip b{display:block}
#ctl{display:flex;align-items:center;gap:14px;margin-top:14px}
#die{width:64px;height:64px;background:#fff;border-radius:14px;box-shadow:0 3px 10px #0002;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;cursor:pointer}
#die i{border-radius:50%;margin:1px}
#die i.o{background:#e0607e}
button{border:0;border-radius:20px;padding:10px 18px;font-size:16px;background:#ff8fb1;color:#fff;box-shadow:0 3px 8px #ff8fb166;cursor:pointer;font-family:inherit}
button#re{background:#b9a4ad;box-shadow:none}
button:disabled{opacity:.45;cursor:default}
#msg{min-height:44px;margin-top:12px;padding:0 10px;text-align:center;font-size:16px;max-width:620px}
#tip{max-width:620px;margin-top:6px;padding:0 14px;font-size:12px;line-height:1.7;color:#9a7f8b;text-align:center}
</style>
</head>
<body>
<h1>✈ 飞行棋 ✈</h1>
<canvas id="cv" width="600" height="600"></canvas>
<div id="bar"></div>
<div id="ctl"><div id="die"></div><button id="roll">掷骰子</button><button id="re">重来</button></div>
<div id="msg"></div>
<div id="tip">掷到 6 才能起飞，6 可以再掷一次。落在自己颜色的格子上跳 4 格，落在白色菱形格上远程飞跃 12 格。落在对手飞机上，会把它撞回机库。到终点前不能超过终点。</div>
<script>
/* ====== 头像图片：把四张图放在同一目录，文件名对应下面的 s ====== */
const AV=[
 {n:'贝贝',s:'bei.png', c:'#ff8fb1'},
 {n:'霁',  s:'ji.png',  c:'#ff9a6c'},
 {n:'GPT', s:'gpt.png', c:'#5b8cff'},
 {n:'GROK',s:'grok.png',c:'#9aa3b5'}
];
/* 没有图片时，会自动用下面代码画的可爱小脸 */
AV.forEach(a=>{const im=new Image();im.onload=()=>a.img=im;im.src=a.s});

const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d'),S=40,FIN=56;
let G,gen=0,T=0,hits=[];
const later=(f,ms)=>{const g=gen;setTimeout(()=>{if(g==gen)f()},ms)};

/* ---------- 棋盘坐标 ---------- */
const ring=[];
(()=>{const a=(x,y)=>ring.push([x+.5,y+.5]);
 for(let x=0;x<=5;x++)a(x,6);for(let y=5;y>=0;y--)a(6,y);a(7,0);
 for(let y=0;y<=5;y++)a(8,y);for(let x=9;x<=14;x++)a(x,6);a(14,7);
 for(let x=14;x>=9;x--)a(x,8);for(let y=9;y<=14;y++)a(8,y);a(7,14);
 for(let y=14;y>=9;y--)a(6,y);for(let x=5;x>=0;x--)a(x,8);a(0,7)})();
const R=(x,y,n)=>{for(let i=0;i<n;i++)[x,y]=[15-y,x];return[x,y]};
function pos(p,k,i){
 if(k<0){const b=[[1.5,1.5],[4.5,1.5],[1.5,4.5],[4.5,4.5]][i];return R(b[0],b[1],p)}
 if(k<=50)return ring[(1+13*p+k)%52];
 if(k<FIN)return R(k-51+1.5,7.5,p);
 let dx=-.7,dy=(i-1.5)*.3;for(let n=0;n<p;n++)[dx,dy]=[-dy,dx];
 return[7.5+dx,7.5+dy]}

/* ---------- 头像 ---------- */
/* 霁=像素螃蟹 / GPT=蓝色小机器人 / GROK=银白圆球 */
function mascot(g,p,x,y,r){
 g.save();g.translate(x,y);
 g.fillStyle=['','#fff1e4','#16213a','#343744'][p];g.strokeStyle=AV[p].c;g.lineWidth=r*.1;
 g.beginPath();g.arc(0,0,r,0,7);g.fill();g.stroke();
 g.beginPath();g.arc(0,0,r*.95,0,7);g.clip();
 if(p==1){const q=r*.17;g.translate(0,-q*.3);g.fillStyle='#e0795a';
  g.fillRect(-3*q,-3*q,6*q,5.5*q);g.fillRect(-4.5*q,-2*q,9*q,2*q);
  g.fillRect(-2.6*q,2*q,1.3*q,1.8*q);g.fillRect(1.3*q,2*q,1.3*q,1.8*q);
  g.fillStyle='#111';g.fillRect(-2*q,-2.3*q,1.1*q,1.1*q);g.fillRect(.9*q,-2.3*q,1.1*q,1.1*q)}
 if(p==2){g.fillStyle='#3d6af2';
  [[-.45,-.42,.27],[.45,-.42,.27],[0,-.58,.3],[-.5,-.1,.26],[.5,-.1,.26]].forEach(([a,b,s])=>{g.beginPath();g.arc(a*r,b*r,s*r,0,7);g.fill()});
  g.beginPath();g.ellipse(0,-.22*r,.58*r,.42*r,0,0,7);g.fill();
  g.beginPath();g.roundRect(-.26*r,.22*r,.52*r,.42*r,r*.14);g.fill();
  g.fillStyle='#0f1a36';g.beginPath();g.roundRect(-.46*r,-.42*r,.92*r,.4*r,r*.1);g.fill();
  g.strokeStyle='#7ec8ff';g.lineWidth=r*.07;g.lineCap='round';g.beginPath();
  g.moveTo(-.3*r,-.33*r);g.lineTo(-.16*r,-.22*r);g.lineTo(-.3*r,-.11*r);g.moveTo(-.02*r,-.1*r);g.lineTo(.22*r,-.1*r);g.stroke()}
 if(p==3){const gr=g.createRadialGradient(-.2*r,-.25*r,r*.05,0,0,r*.75);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#c9ced9');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,.7*r,0,7);g.fill();
  g.fillStyle='#111';[-1,1].forEach(s=>{g.beginPath();g.ellipse(s*.22*r,-.02*r,.1*r,.17*r,0,0,7);g.fill()})}
 g.restore()}
function face(g,p,x,y,r){if(p){mascot(g,p,x,y,r);return}
 g.save();g.translate(x,y);const C=AV[p].c,f=r*.62;
 g.fillStyle=C+'55';g.strokeStyle=C;g.lineWidth=r*.1;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.stroke();
 g.lineWidth=r*.05;
 if(p==0)[-1,1].forEach(s=>{g.fillStyle='#ffd6e4';g.beginPath();g.ellipse(s*f*.55,-f*.95,f*.26,f*.55,s*.25,0,7);g.fill();g.stroke()});
 if(p==2){g.strokeStyle='#3a8f70';g.beginPath();g.moveTo(0,-f);g.lineTo(0,-f*1.3);g.stroke();g.fillStyle=C;g.beginPath();g.arc(0,-f*1.35,f*.12,0,7);g.fill()}
 g.fillStyle=p==2?'#e6fff4':'#fff4ea';g.strokeStyle=C;g.beginPath();g.arc(0,f*.1,f,0,7);g.fill();g.stroke();
 g.fillStyle='#4a3040';g.strokeStyle='#4a3040';g.lineWidth=r*.06;
 [-1,1].forEach(s=>{
  if(p==1){g.beginPath();g.arc(s*f*.38,f*.05,f*.13,Math.PI,0);g.stroke()}
  else if(p==2)g.fillRect(s*f*.38-f*.1,-f*.1,f*.2,f*.24);
  else{g.beginPath();g.arc(s*f*.38,0,f*.11,0,7);g.fill()}});
 g.fillStyle='#ff9fb866';[-1,1].forEach(s=>{g.beginPath();g.ellipse(s*f*.66,f*.3,f*.18,f*.11,0,0,7);g.fill()});
 g.beginPath();g.arc(0,f*.25,f*.2,.15*Math.PI,.85*Math.PI);g.stroke();
 if(p==1){g.fillStyle='#ffd35a';g.beginPath();g.arc(f*.7,-f*.8,f*.28,0,7);g.arc(f*.82,-f*.88,f*.24,0,7);g.fill('evenodd')}
 if(p==3){g.fillStyle='#ffd35a';g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?f*.14:f*.3;g.lineTo(-f*.6+Math.cos(a)*q,-f*.85+Math.sin(a)*q)}g.fill()}
 g.restore()}
function avatar(g,p,x,y,r){
 const a=AV[p];
 if(a.img){g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();
  const w=a.img.width,h=a.img.height,m=Math.min(w,h);
  g.drawImage(a.img,(w-m)/2,(h-m)/2,m,m,x-r,y-r,2*r,2*r);g.restore();
  g.strokeStyle=a.c;g.lineWidth=r*.1;g.beginPath();g.arc(x,y,r,0,7);g.stroke()}
 else face(g,p,x,y,r)}

/* ---------- 绘制 ---------- */
function cell(x,y,fill,stroke){
 c.beginPath();c.roundRect((x-.5)*S+2,(y-.5)*S+2,S-4,S-4,10);
 if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=4;c.stroke()}}
function plane(x,y,p,glow){
 c.save();c.translate(x,y);
 if(glow){c.shadowColor=AV[p].c;c.shadowBlur=14+6*Math.sin(T/150)}
 c.fillStyle='#fff';c.strokeStyle=AV[p].c;c.lineWidth=3;c.beginPath();c.arc(0,0,15,0,7);c.fill();c.stroke();
 c.shadowBlur=0;c.rotate((p+1)*Math.PI/2);c.scale(.85,.85);
 c.fillStyle=AV[p].c;c.strokeStyle='#5a3d4a';c.lineWidth=1.5;c.beginPath();
 [[0,-13],[3,-5],[13,3],[13,6],[3,3],[2,10],[6,13],[6,15],[0,13],[-6,15],[-6,13],[-2,10],[-3,3],[-13,6],[-13,3],[-3,-5]].forEach(([a,b],i)=>i?c.lineTo(a,b):c.moveTo(a,b));
 c.closePath();c.fill();c.stroke();c.restore()}
function draw(t){
 T=t;c.fillStyle='#fffaf5';c.fillRect(0,0,600,600);
 for(let p=0;p<4;p++){
  c.save();c.translate(300,300);c.rotate(p*Math.PI/2);c.translate(-300,-300);
  c.fillStyle=AV[p].c+'40';c.strokeStyle=AV[p].c;c.lineWidth=3;c.beginPath();c.roundRect(10,10,220,220,30);c.fill();c.stroke();
  c.fillStyle='#fff9';[[60,60],[180,60],[60,180],[180,180]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,22,0,7);c.fill()});
  c.restore();
  const[x,y]=R(3,3,p);avatar(c,p,x*S,y*S,32)}
 ring.forEach(([x,y],i)=>cell(x,y,AV[((i-1)%4+4)%4].c+'99'));
 for(let p=0;p<4;p++){
  let[x,y]=ring[(1+13*p)%52];cell(x,y,null,AV[p].c);
  [x,y]=ring[(1+13*p+16)%52];c.fillStyle='#fff';c.beginPath();c.moveTo(x*S,y*S-9);c.lineTo(x*S+9,y*S);c.lineTo(x*S,y*S+9);c.lineTo(x*S-9,y*S);c.fill();
  for(let k=51;k<=55;k++){const[hx,hy]=pos(p,k,0);cell(hx,hy,AV[p].c)}
  c.save();c.translate(300,300);c.rotate(p*Math.PI/2);c.translate(-300,-300);
  c.fillStyle=AV[p].c;c.beginPath();c.moveTo(240,240);c.lineTo(240,360);c.lineTo(300,300);c.fill();c.restore()}
 hits=[];const cnt={},list=[];
 G.pl.forEach((a,p)=>a.forEach((k,i)=>{
  let[x,y]=pos(p,k,i);x*=S;y*=S;
  const key=(x|0)+','+(y|0),n=cnt[key]=(cnt[key]||0)+1;
  if(k>=0&&k<FIN&&n>1){x+=(n-1)*7;y-=(n-1)*7}
  const m=G.ph=='pick'&&p==0&&G.mv.includes(i);
  list.push([x,y,p,m]);if(m)hits.push({x,y,i})}));
 list.sort((a,b)=>a[3]-b[3]).forEach(([x,y,p,m])=>plane(x,y-(m?3+3*Math.abs(Math.sin(T/200)):0),p,m));
 if(G.win>=0){
  c.fillStyle='#fffc';c.fillRect(0,0,600,600);avatar(c,G.win,300,230,70);
  c.fillStyle='#5a3d4a';c.textAlign='center';c.font='bold 36px sans-serif';c.fillText(AV[G.win].n+' 赢啦！🎉',300,360);
  c.font='18px sans-serif';c.fillText('点下面的「重来」再玩一局',300,400)}
 requestAnimationFrame(draw)}

/* ---------- 界面 ---------- */
const die=$('die');for(let i=0;i<9;i++)die.appendChild(document.createElement('i'));
const PIP=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const show=n=>[...die.children].forEach((e,i)=>e.className=PIP[n].includes(i)?'o':'');
AV.forEach(a=>{const d=document.createElement('div');d.className='chip';d.innerHTML='<canvas width="80" height="80"></canvas><b>'+a.n+'</b><span></span>';$('bar').appendChild(d);a.el=d});
const msg=s=>$('msg').textContent=s;
function ui(){
 AV.forEach((a,p)=>{
  const e=a.el,on=G.t==p&&G.win<0;
  e.className='chip'+(on?' on':'');e.style.borderColor=on?a.c:'transparent';
  const g=e.firstChild.getContext('2d');g.clearRect(0,0,80,80);avatar(g,p,40,40,36);
  e.lastChild.textContent='🏁 '+G.pl[p].filter(k=>k==FIN).length+'/4'});
 $('roll').disabled=!(G.t==0&&G.ph=='roll'&&!G.busy&&G.win<0)}

/* ---------- 游戏逻辑 ---------- */
const can=(p,d)=>{const r=[];G.pl[p].forEach((k,i)=>{if(k<0?d==6:k+d<=FIN)r.push(i)});return r};
function init(){
 gen++;G={t:0,d:0,ph:'roll',busy:false,win:-1,mv:[],pl:AV.map(()=>[-1,-1,-1,-1])};
 show(6);msg('贝贝先手～点骰子 🎲，掷到 6 才能起飞');ui()}
function roll(){
 if(G.ph!='roll'||G.busy||G.win>=0)return;G.busy=true;let n=0;
 (function f(){if(n++<8){show(1+Math.random()*6|0);later(f,70)}else{const d=1+Math.random()*6|0;show(d);G.d=d;after(d)}})()}
function after(d){
 const p=G.t,nm=AV[p].n;G.mv=can(p,d);
 if(!G.mv.length){msg(nm+' 掷出了 '+d+'，没有能动的飞机，跳过～');return later(()=>endTurn(0),1100)}
 msg(nm+' 掷出了 '+d+(d==6?'！':''));
 if(p==0&&G.mv.length>1){G.ph='pick';G.busy=false;msg('你掷出了 '+d+'，点一架要飞的飞机吧～');return}
 later(()=>go(p,p?ai(p,d):G.mv[0],d),p?800:500)}
function ai(p,d){
 let b=G.mv[0],bs=-1e9;
 G.mv.forEach(i=>{
  const k=G.pl[p][i],n=k<0?0:k+d;let s=k<0?35:n+Math.random()*4;
  if(n==FIN)s+=100;else if(n>50)s+=25;
  if(n<=50)for(let q=0;q<4;q++)if(q!=p)G.pl[q].forEach(k2=>{if(k2>=0&&k2<=50&&(1+13*q+k2)%52==(1+13*p+n)%52)s+=70});
  if(n==16)s+=30;else if(n>0&&n%4==0&&n<=46)s+=12;
  if(s>bs){bs=s;b=i}});
 return b}
function go(p,i,d){
 G.ph='anim';G.mv=[];G.busy=true;const a=G.pl[p];
 if(a[i]<0){a[i]=0;msg(AV[p].n+' 的飞机起飞啦 ✈');return later(()=>settle(p,i,d),450)}
 let n=0;(function f(){a[i]++;if(++n<d)later(f,170);else later(()=>settle(p,i,d),220)})()}
function settle(p,i,d){
 const a=G.pl[p];let note='';
 if(a[i]>0&&a[i]<=50){
  if(a[i]==16){a[i]=28;note='✨ 远程飞跃 12 格！'}
  else if(a[i]%4==0&&a[i]+4<=50){a[i]+=4;note='跳跃 4 格！'}}
 const k=a[i];let kicked=0;
 if(k<=50)for(let q=0;q<4;q++)if(q!=p)G.pl[q].forEach((k2,j)=>{
  if(k2>=0&&k2<=50&&(1+13*q+k2)%52==(1+13*p+k)%52){G.pl[q][j]=-1;kicked++}});
 if(k==FIN)note+=' 🎉 到家啦！';
 if(kicked)note+=' 💥 撞飞了 '+kicked+' 架！';
 if(note)msg(AV[p].n+'：'+note);
 if(a.every(x=>x==FIN)){G.win=p;G.ph='over';msg('🎉 '+AV[p].n+' 的飞机全部到家，赢啦！');ui();return}
 later(()=>endTurn(d==6),note?900:300)}
function endTurn(x){
 if(!x)G.t=(G.t+1)%4;G.ph='roll';G.busy=false;const p=G.t;
 msg(x?AV[p].n+' 掷出了 6，再来一次！':'轮到 '+AV[p].n+(p?' 啦～':'，点骰子吧 🎲'));
 if(p)later(roll,900)}

/* ---------- 交互 ---------- */
$('roll').onclick=die.onclick=()=>{if(G.t==0)roll()};
$('re').onclick=init;
cv.addEventListener('pointerdown',e=>{
 if(G.ph!='pick')return;
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;
 let b=null,bd=28;hits.forEach(h=>{const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;b=h}});
 if(b){G.busy=true;go(0,b.i,G.d)}});

init();setInterval(ui,200);requestAnimationFrame(draw);
</script>
</body>
</html>
